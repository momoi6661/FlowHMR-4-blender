[project]
name = "flowhmr-source"
version = "0.3.6"
description = "FlowHMR video-to-motion inference backend"
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate==0.30.1",
    "aiohttp>=3.10",
    "braceexpand>=0.1.7",
    "cmake>=3.15,<4",
    "einops>=0.7",
    "flask>=3.0",
    "huggingface-hub>=0.30,<1.0",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.5",
    "joblib>=1.2",
    "loguru",
    "matplotlib>=3.7",
    "motion-correction==1.0.0; sys_platform == 'win32'",
    "numpy==1.26.4",
    "omegaconf>=2.3",
    "opencv-python==4.11.0.86",
    "opencv-python-headless==4.11.0.86",
    "pillow",
    "psutil",
    "pycocotools",
    "pytorch-lightning>=2.0",
    "pyyaml>=6.0",
    "roma",
    "rgbmocap-correction==0.1.0; sys_platform == 'win32'",
    "scipy>=1.10",
    "setuptools==75.8.0",
    "supervision>=0.25,<0.31",
    "tabulate",
    "thop",
    "timm",
    "torch==2.8.0+cu128",
    "torchdiffeq==0.2.5",
    "torchmetrics",
    "torchvision==0.23.0+cu128",
    "tqdm",
    "transforms3d==0.4.2",
    "webdataset>=0.2.80",
    "yacs",
    "yolox",
    "termcolor>=2.4,<4",
    "mcp==1.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
default-groups = ["dev"]
index-strategy = "unsafe-best-match"
extra-index-url = ["https://download.pytorch.org/whl/cu128"]

[tool.uv.sources]
yolox = { path = "third_party/YOLOX", editable = true }
motion-correction = { path = ".cache/correction/motion_correction-1.0.0-cp310-cp310-win_amd64.whl" }
rgbmocap-correction = { path = "third_party/RGBMocapCorrection", editable = true }
